<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>博客 - Fizgrad</title>
  <link rel="icon" href="../assets/img/avatar.png" />
  <link rel="stylesheet" href="../assets/css/fonts.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/github-markdown-css@5.9.0/github-markdown-dark.css" integrity="sha384-nlth4oyFjBlAziFH2oypWWsE00W7j/6uVR4/Fz1++oPhaqeF8LujWsaX3ChXZw/1" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link rel="stylesheet" href="../assets/css/style.css" />
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.4.12/dist/purify.min.js" integrity="sha384-piCcpDdJ7qVeK4Tv8Z6Hpcr3ZBIgP16TxQTPVfsLFdZ5uDgwc3Y8Ho7oUnqf12qu" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/15.0.4/marked.min.js" integrity="sha384-2NndlFAl0twi2nmu3w9mixodZFiN2fbxlakcYJF86bn1JeS1VB87/XqA7cqymzS+" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/highlight.min.js" integrity="sha384-RH2xi4eIQ/gjtbs9fUXM68sLSi99C7ZWBRX1vDrVv6GQXRibxXLbwO2NGZB74MbU" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/styles/github-dark.min.css" integrity="sha384-wH75j6z1lH97ZOpMOInqhgKzFkAInZPPSPlZpYKYTOqsaizPvhQZmAtLcPKXpLyH" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <script src="https://cdn.jsdelivr.net/npm/mermaid@11.16.0/dist/mermaid.min.js" integrity="sha384-T/0lMUdJpd2S1ZHtRiofG3htU3xPCrFVeAQ1UUE2TJwlEJSV5NUwn30kP28n238E" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <script>
    window.MathJax = {
      startup: { typeset: false },
      tex: {
        inlineMath: [['$', '$'], ['\\(', '\\)']],
        displayMath: [['$$', '$$'], ['\\[', '\\]']],
        processEscapes: true
      },
      options: {
        ignoreHtmlClass: 'tex2jax_ignore',
        processHtmlClass: 'tex2jax_process'
      }
    };
  </script>
  <script id="MathJax-script" defer src="https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-mml-chtml.js" integrity="sha384-Wuix6BuhrWbjDBs24bXrjf4ZQ5aFeFWBuKkFekO2t8xFU0iNaLQfp2K6/1Nxveei" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
</head>
<body>
  <div class="grid-overlay" aria-hidden="true"></div>

  <header class="nav scrolled">
    <a href="../" class="nav-logo">&lt;fizgrad/&gt;</a>
    <nav class="nav-links">
      <a href="../" data-i18n-aria="homeAria" aria-label="返回主页"><span class="nav-back-full" data-i18n="home">← 主页</span><span class="nav-back-short" aria-hidden="true">←</span></a>
      <button id="lang-toggle" class="lang-btn" type="button" aria-label="Switch to English">EN</button>
    </nav>
  </header>

  <main id="main" class="post-page">
    <nav class="blog-breadcrumb" id="post-breadcrumb" data-i18n-aria="blogNavigation" aria-label="博客导航" hidden>
      <a href="../#blog" data-i18n="blogTitle">博客</a>
      <span aria-hidden="true">/</span>
      <a id="post-category-link" href="index.html"></a>
    </nav>
    <div class="post-layout">
      <article class="markdown-body post-wrap post-main" id="post-content">
        <p class="post-loading" data-i18n="loading">加载中...</p>
      </article>

      <aside class="toc-sidebar" id="toc-sidebar">
        <div class="toc-title" data-i18n="tocTitle">目录</div>
        <div class="toc-progress"><div class="toc-progress-bar" id="toc-progress-bar"></div></div>
        <ul class="toc-nav" id="toc-nav"></ul>
      </aside>
    </div>
  </main>

  <footer class="footer">
    <p>&copy; <span id="year"></span> Fizgrad · <span data-i18n="footerBuilt">使用 GLM-5.2 构建</span></p>
    <a href="index.html" id="post-back-list" class="back-top" data-i18n="backToList">← 返回文章列表</a>
  </footer>

  <script src="../assets/js/blog-catalog.js"></script>
  <script src="../assets/js/markdown-code.js"></script>
  <script src="../assets/js/mermaid-viewer.js"></script>
  <script>
    (function () {
      var mathItems = new Map();
      var mathSeq = 0;

      function emitMathToken(tex, display) {
        var id = "math-" + (mathSeq++);
        mathItems.set(id, { tex: tex, display: display });
        var tag = display ? "div" : "span";
        return '<' + tag + ' class="math-slot tex2jax_process" data-math-id="' + id + '"></' + tag + '>';
      }

      function hydrateMathSlots(container) {
        var slots = container.querySelectorAll("[data-math-id]");
        for (var i = 0; i < slots.length; i++) {
          var slot = slots[i];
          var id = slot.getAttribute("data-math-id");
          var item = mathItems.get(id);
          if (!item) { slot.textContent = t("mathMissing"); continue; }
          slot.textContent = item.display ? "\\[" + item.tex + "\\]" : "\\(" + item.tex + "\\)";
        }
      }

      var parseMathExtension = {
        name: "math",
        level: "block",
        start: function (src) {
          var idx = src.indexOf("$$");
          if (idx !== -1) return idx;
          idx = src.indexOf("\\[");
          return idx;
        },
        tokenizer: function (src) {
          var dlMatch = src.match(/^\$\$([\s\S]*?)\$\$/);
          if (!dlMatch) dlMatch = src.match(/^\\\[([\s\S]*?)\\\]/);
          if (!dlMatch) return undefined;
          var tex = dlMatch[1].trim();
          var html = emitMathToken(tex, true);
          return { type: "math", raw: dlMatch[0], html: html, tokens: [] };
        },
        renderer: function (token) { return token.html; }
      };

      var inlineMathExtension = {
        name: "inlineMath",
        level: "inline",
        start: function (src) {
          var m = src.match(/\\\(|\$(?!\$)/);
          return m ? m.index : -1;
        },
        tokenizer: function (src) {
          if (src[0] === "\\" && src[1] === "(") {
            var end = src.indexOf("\\)", 2);
            if (end === -1) return undefined;
            var tex = src.slice(2, end).trim();
            return { type: "inlineMath", raw: src.slice(0, end + 2), html: emitMathToken(tex, false), tokens: [] };
          }
          if (src[0] === "$" && src[1] !== "$") {
            var idx = src.indexOf("$", 1);
            if (idx === -1) return undefined;
            if (src[idx - 1] === "\\") return undefined;
            var tex2 = src.slice(1, idx).trim();
            return { type: "inlineMath", raw: src.slice(0, idx + 1), html: emitMathToken(tex2, false), tokens: [] };
          }
          return undefined;
        },
        renderer: function (token) { return token.html; }
      };

      var markedReady = false;
      if (typeof marked !== "undefined" && marked.parse) {
        try {
          marked.use({ extensions: [parseMathExtension, inlineMathExtension] });
          markedReady = true;
        } catch (e) {
          markedReady = false;
        }
      }
      var sanitizerReady = typeof DOMPurify !== "undefined"
        && typeof DOMPurify.sanitize === "function"
        && DOMPurify.isSupported !== false;

      var I18N = {
        zh: {
          lang: "zh-CN", blogTitle: "博客", home: "← 主页", homeAria: "返回主页",
          tocTitle: "目录", footerBuilt: "使用 GLM-5.2 构建", backHome: "← 返回主页",
          backToList: "← 返回文章列表", blogNavigation: "博客导航",
          loading: "加载中...", notFound: "未找到文章", loadFailed: "文章加载失败",
          translationMissing: "这篇文章的英文版本尚未生成，当前显示中文原文。",
          copy: "复制", copied: "已复制", copyFailed: "复制失败",
          zoomIn: "放大图表", zoomOut: "缩小图表", fullscreen: "网页全屏查看图表", exitFullscreen: "返回正文",
          diagramControls: "图表控制", expandCode: "展开（共 {lines} 行）", collapseCode: "收起",
          expandSection: "展开本节", collapseSection: "收起本节", headingAnchor: "链接到本节：",
          mathMissing: "[公式数据缺失]"
        },
        en: {
          lang: "en", blogTitle: "Blog", home: "← Home", homeAria: "Back to home",
          tocTitle: "Contents", footerBuilt: "Built with GLM-5.2", backHome: "← Back to home",
          backToList: "← Back to articles", blogNavigation: "Blog navigation",
          loading: "Loading...", notFound: "Post not found", loadFailed: "Failed to load post",
          translationMissing: "The English version of this post is not available yet. Showing the Chinese original.",
          copy: "Copy", copied: "Copied!", copyFailed: "Failed",
          zoomIn: "Zoom in", zoomOut: "Zoom out", fullscreen: "Expand diagram to fill page", exitFullscreen: "Back to document",
          diagramControls: "Diagram controls", expandCode: "Expand ({lines} lines)", collapseCode: "Collapse",
          expandSection: "Expand section", collapseSection: "Collapse section", headingAnchor: "Link to section: ",
          mathMissing: "[Missing formula data]"
        }
      };

      var params = new URLSearchParams(window.location.search);
      var slug = params.get("slug");
      var currentPost = null;
      var lang = (function () {
        try {
          var stored = localStorage.getItem("lang");
          if (stored === "en" || stored === "zh") return stored;
        } catch (e) {}
        return (navigator.language || "zh").toLowerCase().indexOf("en") === 0 ? "en" : "zh";
      })();

      function t(key) { return I18N[lang][key] || key; }

      function updateTitle() {
        var title = currentPost ? (lang === "en" ? (currentPost.titleEn || currentPost.title) : currentPost.title) : t("blogTitle");
        document.title = title + " - Fizgrad";
      }

      function updateBlogNavigation() {
        if (!currentPost) return;
        var topic = BlogCatalog.categoryFor(currentPost);
        var requested = params.get("category");
        var state = requested === "all" || requested === topic.id
          ? BlogCatalog.readState(window.location.search)
          : { category: topic.id, page: 1, query: "" };
        var category = BlogCatalog.category(state.category);
        var link = document.getElementById("post-category-link");
        link.textContent = BlogCatalog.localized(category, "title", lang);
        link.href = BlogCatalog.listURL(state);
        document.getElementById("post-back-list").href = link.href;
        document.getElementById("post-breadcrumb").hidden = false;
      }

      function updateCodeExpandButton(btn) {
        var wrapper = btn.closest(".code-block-wrapper");
        var lines = btn.dataset.lines || "";
        btn.textContent = wrapper && wrapper.dataset.expanded === "true"
          ? t("collapseCode")
          : t("expandCode").replace("{lines}", lines);
      }

      function updateDynamicLabels() {
        document.querySelectorAll("#post-content .copy-btn").forEach(function (btn) {
          btn.textContent = t("copy");
          btn.setAttribute("aria-label", t("copy"));
        });
        document.querySelectorAll("#post-content .code-expand-btn").forEach(updateCodeExpandButton);
        if (typeof MermaidViewer !== "undefined") {
          MermaidViewer.updateLabels(document.getElementById("post-content"), t);
        }
        document.querySelectorAll("#post-content .section-toggle").forEach(function (btn) {
          var collapsed = btn.parentElement.classList.contains("collapsed");
          btn.setAttribute("aria-label", t(collapsed ? "expandSection" : "collapseSection"));
          btn.setAttribute("aria-expanded", String(!collapsed));
        });
        document.querySelectorAll("#post-content .heading-anchor").forEach(function (link) {
          link.setAttribute("aria-label", t("headingAnchor") + (link.dataset.headingText || ""));
        });
      }

      function applyI18n() {
        document.documentElement.lang = t("lang");
        updateTitle();
        document.querySelectorAll("[data-i18n]").forEach(function (el) {
          var value = I18N[lang][el.getAttribute("data-i18n")];
          if (value) el.textContent = value;
        });
        document.querySelectorAll("[data-i18n-aria]").forEach(function (el) {
          var value = I18N[lang][el.getAttribute("data-i18n-aria")];
          if (value) el.setAttribute("aria-label", value);
        });
        var btn = document.getElementById("lang-toggle");
        btn.textContent = lang === "zh" ? "EN" : "中";
        btn.setAttribute("aria-label", lang === "zh" ? "Switch to English" : "切换到中文");
        updateBlogNavigation();
        updateDynamicLabels();
      }

      function showPostStatus(key) {
        var container = document.getElementById("post-content");
        var status = document.createElement("p");
        status.className = "post-loading";
        status.setAttribute("data-i18n", key);
        status.textContent = t(key);
        container.replaceChildren(status);
      }

      document.getElementById("year").textContent = new Date().getFullYear();
      applyI18n();

      document.getElementById("lang-toggle").addEventListener("click", function () {
        lang = lang === "zh" ? "en" : "zh";
        try { localStorage.setItem("lang", lang); } catch (e) {}
        if (currentPost) window.location.reload();
        else applyI18n();
      });

      function fetchPostMarkdown(post) {
        var encodedSlug = encodeURIComponent(post.slug);
        var requestedLanguage = lang;
        var requestedPath = encodedSlug + (requestedLanguage === "en" ? ".en" : "") + ".md";

        return fetch(requestedPath).then(function (response) {
          if (response.ok) {
            return response.text().then(function (markdown) {
              return { markdown: markdown, contentLanguage: requestedLanguage, fallback: false };
            });
          }
          if (requestedLanguage !== "en" || response.status !== 404) {
            throw new Error("Not found");
          }
          return fetch(encodedSlug + ".md").then(function (fallbackResponse) {
            if (!fallbackResponse.ok) throw new Error("Not found");
            return fallbackResponse.text().then(function (markdown) {
              return { markdown: markdown, contentLanguage: "zh", fallback: true };
            });
          });
        });
      }

      if (!slug) {
        showPostStatus("notFound");
        return;
      }

      fetch("posts.json")
        .then(function (r) {
          if (!r.ok) throw new Error("Failed to load post index");
          return r.json();
        })
        .then(function (posts) {
          if (!Array.isArray(posts)) throw new Error("Invalid post index");
          var post = posts.find(function (p) { return p.slug === slug; });
          if (!post) {
            var notFoundError = new Error("Post not found");
            notFoundError.code = "POST_NOT_FOUND";
            throw notFoundError;
          }
          currentPost = post;
          applyI18n();
          return fetchPostMarkdown(post);
        })
        .then(function (payload) {
          var container = document.getElementById("post-content");
          var md = payload.markdown;
          container.setAttribute("lang", payload.contentLanguage === "en" ? "en" : "zh-CN");
          if (markedReady && sanitizerReady) {
            mathItems.clear();
            mathSeq = 0;
            var html = marked.parse(md);
            var safeHtml = DOMPurify.sanitize(html, {
              USE_PROFILES: { html: true },
              SANITIZE_NAMED_PROPS: true,
              FORBID_TAGS: ["base", "button", "embed", "form", "iframe", "input", "link", "meta", "object", "option", "select", "style", "textarea"],
              FORBID_ATTR: ["srcdoc", "style"]
            });
            container.innerHTML = safeHtml;
            hydrateMathSlots(container);
          } else {
            var pre = document.createElement("pre");
            pre.textContent = md;
            container.replaceChildren(pre);
            return;
          }
          if (payload.fallback) {
            var translationNotice = document.createElement("p");
            translationNotice.className = "post-translation-notice";
            translationNotice.textContent = t("translationMissing");
            container.insertBefore(translationNotice, container.firstChild);
          }
          if (typeof hljs !== "undefined") {
            container.querySelectorAll("pre code:not(.language-mermaid)").forEach(function (block) {
              hljs.highlightElement(block);
            });
          }
          if (typeof MathJax !== "undefined" && MathJax.startup && MathJax.startup.promise) {
            MathJax.startup.promise.then(function () {
              MathJax.typesetClear([container]);
              MathJax.typesetPromise([container]).catch(function () {});
            });
          } else if (typeof MathJax !== "undefined" && MathJax.typesetPromise) {
            MathJax.typesetPromise([container]).catch(function () {});
          }
          MarkdownCode.attachCopyButtons(container, { label: t });
          var mermaidBlocks = container.querySelectorAll("pre code.language-mermaid");
          if (mermaidBlocks.length > 0 && typeof mermaid !== "undefined") {
            mermaid.initialize(MermaidViewer.config());
            mermaidBlocks.forEach(function (code) {
              var wrapper = MermaidViewer.createDiagram(code.textContent, { label: t });
              code.parentElement.replaceWith(wrapper);
            });
            try {
              var renderResult = MermaidViewer.render();
              if (renderResult && typeof renderResult.then === "function") {
                renderResult.then(function () {
                  MermaidViewer.refresh(container);
                }).catch(function () {});
              } else {
                setTimeout(function () { MermaidViewer.refresh(container); }, 800);
              }
            } catch (e) {}
          }
          var slugSet = {};
          container.querySelectorAll("h1, h2, h3, h4, h5, h6").forEach(function (h) {
            var text = h.textContent.trim();
            var slug = text.toLowerCase().replace(/[^\w\u4e00-\u9fa5\s-]/g, "").replace(/\s+/g, "-");
            if (!slug) slug = "heading";
            if (slugSet[slug]) { slugSet[slug]++; slug = slug + "-" + slugSet[slug]; }
            else { slugSet[slug] = 1; }
            h.id = slug;
            var link = document.createElement("a");
            link.className = "heading-anchor";
            link.href = "#" + slug;
            link.textContent = "#";
            link.dataset.headingText = text;
            link.setAttribute("aria-label", t("headingAnchor") + text);
            h.appendChild(link);
          });

          /* ===================== Build TOC ===================== */
          var headings = container.querySelectorAll("h1, h2");
          if (headings.length >= 2) {
            var tocNav = document.getElementById("toc-nav");
            var headingData = [];
            var currentChapterId = "";

            headings.forEach(function (h) {
              var level = parseInt(h.tagName.charAt(1), 10);
              var text = h.textContent.replace(/#\s*$/, "").trim();
              if (level === 1) currentChapterId = h.id;
              headingData.push({
                el: h,
                id: h.id,
                level: level,
                text: text,
                chapterId: currentChapterId || h.id
              });
            });

            tocNav.replaceChildren();
            var chapterItems = {};
            var chapterLists = {};
            headingData.forEach(function (item) {
              var li = document.createElement("li");
              var tocLink = document.createElement("a");
              var cls = "toc-h" + item.level;
              tocLink.href = "#" + item.id;
              tocLink.className = cls;
              tocLink.dataset.tocTarget = item.id;
              tocLink.textContent = item.text;
              li.appendChild(tocLink);

              if (item.level === 1) {
                var sectionList = document.createElement("ul");
                sectionList.className = "toc-sections";
                sectionList.id = "toc-sections-" + item.id;
                sectionList.hidden = true;
                li.className = "toc-chapter";
                li.dataset.tocChapter = item.id;
                li.appendChild(sectionList);
                tocNav.appendChild(li);
                chapterItems[item.id] = li;
                chapterLists[item.id] = sectionList;
              } else if (chapterLists[item.chapterId]) {
                chapterLists[item.chapterId].appendChild(li);
                chapterItems[item.chapterId].classList.add("has-sections");
                var chapterLink = chapterItems[item.chapterId].firstElementChild;
                chapterLink.setAttribute("aria-controls", chapterLists[item.chapterId].id);
                chapterLink.setAttribute("aria-expanded", "false");
              } else {
                tocNav.appendChild(li);
              }
            });

            /* Smooth scroll for TOC links (account for fixed nav) */
            document.querySelectorAll("#toc-sidebar .toc-nav a").forEach(function (a) {
              a.addEventListener("click", function (e) {
                e.preventDefault();
                var targetId = a.getAttribute("href").slice(1);
                var target = document.getElementById(targetId);
                if (target) {
                  var top = target.getBoundingClientRect().top + window.scrollY - 70;
                  window.scrollTo({ top: top, behavior: "smooth" });
                  history.replaceState(null, "", "#" + targetId);
                }
              });
            });

            /* Scroll spy: highlight current section */
            var tocLinks = document.querySelectorAll("#toc-sidebar .toc-nav a");
            var progressBar = document.getElementById("toc-progress-bar");
            var scrollPadding = 80;

            function updateTOC() {
              var scrollPos = window.scrollY + scrollPadding;
              var currentIdx = 0;
              for (var i = 0; i < headingData.length; i++) {
                if (headingData[i].el.getBoundingClientRect().top + window.scrollY <= scrollPos) {
                  currentIdx = i;
                } else {
                  break;
                }
              }
              tocLinks.forEach(function (link) {
                link.classList.toggle("active", link.dataset.tocTarget === headingData[currentIdx].id);
              });

              var activeChapterId = headingData[currentIdx].chapterId;
              Object.keys(chapterItems).forEach(function (chapterId) {
                var chapterItem = chapterItems[chapterId];
                var isCurrent = chapterId === activeChapterId;
                chapterItem.classList.toggle("current", isCurrent);
                chapterLists[chapterId].hidden = !isCurrent;
                if (chapterItem.classList.contains("has-sections")) {
                  chapterItem.firstElementChild.setAttribute("aria-expanded", String(isCurrent));
                }
              });

              /* Auto-scroll TOC sidebar to keep active item visible */
              var tocSidebar = document.getElementById("toc-sidebar");
              var activeLink = tocSidebar.querySelector("a.active");
              if (activeLink) {
                var sidebarRect = tocSidebar.getBoundingClientRect();
                var linkRect = activeLink.getBoundingClientRect();
                if (linkRect.top < sidebarRect.top || linkRect.bottom > sidebarRect.bottom) {
                  activeLink.scrollIntoView({ block: "nearest", behavior: "smooth" });
                }
              }

              /* Progress bar */
              var docHeight = document.documentElement.scrollHeight - window.innerHeight;
              var scrollPct = docHeight > 0 ? Math.min(window.scrollY / docHeight, 1) : 0;
              progressBar.style.width = (scrollPct * 100) + "%";
            }

            var scrollTimer = null;
            window.addEventListener("scroll", function () {
              if (scrollTimer) return;
              scrollTimer = requestAnimationFrame(function () {
                updateTOC();
                scrollTimer = null;
              });
            }, { passive: true });
            updateTOC();
          }
          MarkdownCode.getCopyableCodeBlocks(container).forEach(function (pre) {
            var code = pre.querySelector("code");
            if (!code) return;
            var lines = code.textContent.replace(/\n$/, "").split("\n").length;
            if (lines <= 15) return;
            var wrapper = document.createElement("div");
            wrapper.className = "code-block-wrapper";
            wrapper.dataset.expanded = "false";
            var existingBtn = pre.querySelector(".copy-btn");
            pre.parentNode.insertBefore(wrapper, pre);
            wrapper.appendChild(pre);
            if (existingBtn) wrapper.appendChild(existingBtn);
            var expandBtn = document.createElement("button");
            expandBtn.className = "code-expand-btn";
            expandBtn.dataset.lines = String(lines);
            updateCodeExpandButton(expandBtn);
            expandBtn.addEventListener("click", function () {
              wrapper.dataset.expanded = wrapper.dataset.expanded === "true" ? "false" : "true";
              updateCodeExpandButton(expandBtn);
            });
            wrapper.appendChild(expandBtn);
          });

          function updateSectionVisibility() {
            var collapsedLevels = [];
            Array.from(container.children).forEach(function (node) {
              var match = /^H([1-6])$/.exec(node.tagName);
              if (match) {
                var level = parseInt(match[1], 10);
                collapsedLevels = collapsedLevels.filter(function (collapsedLevel) { return collapsedLevel < level; });
                node.hidden = collapsedLevels.length > 0;
                if ((level === 2 || level === 3) && node.classList.contains("collapsed")) {
                  collapsedLevels.push(level);
                }
              } else {
                node.hidden = collapsedLevels.length > 0;
              }
            });
          }

          Array.from(container.children).filter(function (node) {
            return node.tagName === "H2" || node.tagName === "H3";
          }).forEach(function (heading) {
            var toggle = document.createElement("button");
            toggle.className = "section-toggle";
            toggle.textContent = "▼";
            toggle.setAttribute("aria-label", t("collapseSection"));
            toggle.setAttribute("aria-expanded", "true");
            toggle.addEventListener("click", function () {
              var collapsed = heading.classList.toggle("collapsed");
              toggle.textContent = collapsed ? "▶" : "▼";
              toggle.setAttribute("aria-label", t(collapsed ? "expandSection" : "collapseSection"));
              toggle.setAttribute("aria-expanded", String(!collapsed));
              updateSectionVisibility();
            });
            heading.insertBefore(toggle, heading.firstChild);
          });
          updateSectionVisibility();
          if (window.location.hash) {
            var hashId;
            try { hashId = decodeURIComponent(window.location.hash.slice(1)); }
            catch (e) { hashId = window.location.hash.slice(1); }
            var target = document.getElementById(hashId);
            if (target) {
              setTimeout(function () {
                var top = target.getBoundingClientRect().top + window.scrollY - 70;
                window.scrollTo({ top: top, behavior: "smooth" });
              }, 300);
            }
          }
        })
        .catch(function (error) {
          showPostStatus(error && error.code === "POST_NOT_FOUND" ? "notFound" : "loadFailed");
        });
    })();
  </script>
</body>
</html>
