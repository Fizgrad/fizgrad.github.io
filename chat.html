<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI 对话 - Fizgrad</title>
  <link rel="icon" href="assets/img/avatar.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/github-markdown-css@5/github-markdown-dark.css" crossorigin="anonymous" />
  <link rel="stylesheet" href="assets/css/style.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/15.0.4/marked.min.js" crossorigin="anonymous"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/highlight.min.js" crossorigin="anonymous"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/styles/github-dark.min.css" crossorigin="anonymous" />
  <script src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js" crossorigin="anonymous"></script>
  <script>
    window.MathJax = {
      startup: { typeset: false },
      tex: {
        inlineMath: [['$', '$'], ['\\(', '\\)']],
        displayMath: [['$$', '$$'], ['\\[', '\\]']],
        processEscapes: true
      },
      options: {
        ignoreHtmlClass: 'tex2jax_ignore',
        processHtmlClass: 'tex2jax_process'
      }
    };
  </script>
  <script id="MathJax-script" defer src="https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-mml-chtml.js"></script>
</head>
<body>
  <div class="grid-overlay" aria-hidden="true"></div>

  <header class="nav scrolled">
    <a href="./" class="nav-logo">&lt;fizgrad/&gt;</a>
    <nav class="nav-links">
      <a href="./"><span class="nav-back-full">← 主页 / Home</span><span class="nav-back-short">←</span></a>
      <button id="lang-toggle" class="lang-btn" type="button" aria-label="Switch to English">EN</button>
      <button id="chat-settings-toggle" class="lang-btn" type="button" aria-label="Toggle settings" data-i18n="settings">设置</button>
    </nav>
  </header>

  <main id="main" class="chat-page">
    <aside class="chat-settings" id="chat-settings">
      <h2 class="chat-settings-title" data-i18n="apiConfig">API 配置</h2>
      <label class="chat-field">
        <span>Base URL</span>
        <input type="text" id="cfg-baseurl" value="https://api.deepseek.com" spellcheck="false" />
      </label>
      <label class="chat-field">
        <span>API Key</span>
        <input type="password" id="cfg-apikey" placeholder="sk-..." spellcheck="false" />
      </label>
      <label class="chat-field">
        <span data-i18n="modelId">Model ID</span>
        <select id="cfg-model-select" class="chat-select">
          <option value="deepseek-v4-pro">deepseek-v4-pro</option>
          <option value="deepseek-v4-flash">deepseek-v4-flash</option>
          <option value="kimi-k2.7-code">kimi-k2.7-code</option>
          <option value="ark-code-latest">ark-code-latest</option>
          <option value="doubao-seed-2.0-lite">doubao-seed-2.0-lite</option>
          <option value="doubao-seed-2.0-mini">doubao-seed-2.0-mini</option>
          <option value="glm-5.2">glm-5.2</option>
          <option value="minimax-m3">minimax-m3</option>
          <option value="minimax-m2.7">minimax-m2.7</option>
          <option value="kimi-k2.6">kimi-k2.6</option>
          <option value="doubao-seed-evolving">doubao-seed-evolving</option>
          <option value="kimi-k3">kimi-k3</option>
          <option value="doubao-seed-2.1-turbo">doubao-seed-2.1-turbo</option>
          <option value="__custom__" data-i18n="modelCustom">自定义...</option>
        </select>
        <input type="text" id="cfg-model-custom" class="chat-field-input-hidden" placeholder="输入自定义 Model ID" spellcheck="false" />
      </label>
      <label class="chat-field">
        <span data-i18n="corsProxy">CORS 代理 (可选)</span>
        <input type="text" id="cfg-proxy" placeholder="" spellcheck="false" />
      </label>
      <p class="chat-settings-hint" data-i18n="corsHint">若遇到 CORS 报错，可填入 CORS 代理前缀。</p>
      <label class="chat-field">
        <span data-i18n="systemPrompt">System Prompt</span>
        <textarea id="cfg-system" rows="3" placeholder="You are a helpful assistant." spellcheck="false"></textarea>
      </label>
      <label class="chat-field">
        <span>Temperature <b id="temp-val">1.0</b></span>
        <input type="range" id="cfg-temp" min="0" max="2" step="0.1" value="1.0" />
      </label>
      <label class="chat-field">
        <span>Top P <b id="topp-val">1.0</b></span>
        <input type="range" id="cfg-topp" min="0" max="1" step="0.05" value="1.0" />
      </label>
      <label class="chat-field">
        <span data-i18n="maxTokens">Max Tokens</span>
        <input type="number" id="cfg-maxtokens" value="4096" min="1" max="32768" />
      </label>
      <label class="chat-field">
        <span>Stop</span>
        <input type="text" id="cfg-stop" placeholder="逗号分隔, 可选" spellcheck="false" />
      </label>
      <label class="chat-field">
        <span data-i18n="thinking">思考模式</span>
        <select id="cfg-thinking" class="chat-select">
          <option value="enabled" data-i18n="thinkingOn">开启 (默认)</option>
          <option value="disabled" data-i18n="thinkingOff">关闭</option>
        </select>
      </label>
      <label class="chat-field">
        <span data-i18n="reasoningEffort">推理强度</span>
        <select id="cfg-reasoning" class="chat-select">
          <option value="high">high (默认)</option>
          <option value="max">max</option>
        </select>
      </label>
      <label class="chat-field">
        <span data-i18n="responseFormat">输出格式</span>
        <select id="cfg-respformat" class="chat-select">
          <option value="text" data-i18n="respText">普通文本</option>
          <option value="json_object" data-i18n="respJson">JSON</option>
        </select>
      </label>
      <label class="chat-field chat-field-check">
        <span data-i18n="stream">Stream 流式输出</span>
        <input type="checkbox" id="cfg-stream" checked />
      </label>
      <label class="chat-field chat-field-check">
        <span data-i18n="streamUsage">返回 Token 用量统计</span>
        <input type="checkbox" id="cfg-stream-usage" />
      </label>
      <label class="chat-field">
        <span data-i18n="userId">用户标识 (可选)</span>
        <input type="text" id="cfg-userid" placeholder="user_10001 (仅允许字母数字-_)" spellcheck="false" />
      </label>
      <p class="chat-settings-hint" data-i18n="jsonHint">JSON 模式需在 System Prompt 或消息中明确要求 JSON 格式，否则可能输出空白。</p>

      <button id="cfg-clear" type="button" data-i18n="clearChat">清空对话</button>
      <p class="chat-settings-hint" data-i18n="cfgHint">修改自动保存到 localStorage。</p>
    </aside>

    <div class="chat-main">
      <div class="chat-messages" id="chat-messages">
        <div class="chat-empty">
          <p data-i18n="emptyMsg">配置好 API 后开始对话吧。</p>
          <p class="chat-empty-sub" data-i18n="emptySub">支持 Markdown 渲染、代码高亮、流式输出。</p>
        </div>
      </div>
      <div class="chat-input-area">
        <textarea id="chat-input" class="chat-input" data-i18n-ph="inputPlaceholder" placeholder="输入消息... (Enter 发送, Shift+Enter 换行)" rows="1" spellcheck="false"></textarea>
        <button id="chat-send" class="chat-send-btn" type="button" data-i18n="send">发送</button>
      </div>
    </div>
  </main>

  <footer class="footer">
    <p>&copy; <span id="year"></span> Fizgrad · Built with GLM-5.2</p>
    <a href="./" class="back-top">← 返回主页 / Back to home</a>
  </footer>

  <script>
    (function () {
      document.getElementById("year").textContent = new Date().getFullYear();

      var mathItems = new Map();
      var mathSeq = 0;

      function emitMathToken(tex, display) {
        var id = "math-" + (mathSeq++);
        mathItems.set(id, { tex: tex, display: display });
        var tag = display ? "div" : "span";
        return '<' + tag + ' class="math-slot tex2jax_process" data-math-id="' + id + '"></' + tag + '>';
      }

      function hydrateMathSlots(container) {
        var slots = container.querySelectorAll("[data-math-id]");
        for (var i = 0; i < slots.length; i++) {
          var slot = slots[i];
          var id = slot.getAttribute("data-math-id");
          var item = mathItems.get(id);
          if (!item) { slot.textContent = "[公式数据缺失]"; continue; }
          slot.textContent = item.display ? "\\[" + item.tex + "\\]" : "\\(" + item.tex + "\\)";
        }
      }

      var parseMathExtension = {
        name: "math",
        level: "block",
        start: function (src) {
          var idx = src.indexOf("$$");
          if (idx !== -1) return idx;
          idx = src.indexOf("\\[");
          return idx;
        },
        tokenizer: function (src) {
          var dlMatch = src.match(/^\$\$([\s\S]*?)\$\$/);
          if (!dlMatch) dlMatch = src.match(/^\\\[([\s\S]*?)\\\]/);
          if (!dlMatch) return undefined;
          var tex = dlMatch[1].trim();
          var html = emitMathToken(tex, true);
          return { type: "math", raw: dlMatch[0], html: html, tokens: [] };
        },
        renderer: function (token) { return token.html; }
      };

      var inlineMathExtension = {
        name: "inlineMath",
        level: "inline",
        start: function (src) {
          var m = src.match(/\\\(|\$(?!\$)/);
          return m ? m.index : -1;
        },
        tokenizer: function (src) {
          if (src[0] === "\\" && src[1] === "(") {
            var end = src.indexOf("\\)", 2);
            if (end === -1) return undefined;
            var tex = src.slice(2, end).trim();
            return { type: "inlineMath", raw: src.slice(0, end + 2), html: emitMathToken(tex, false), tokens: [] };
          }
          if (src[0] === "$" && src[1] !== "$") {
            var idx = src.indexOf("$", 1);
            if (idx === -1) return undefined;
            if (src[idx - 1] === "\\") return undefined;
            var tex2 = src.slice(1, idx).trim();
            return { type: "inlineMath", raw: src.slice(0, idx + 1), html: emitMathToken(tex2, false), tokens: [] };
          }
          return undefined;
        },
        renderer: function (token) { return token.html; }
      };

      var markedReady = false;
      if (typeof marked !== "undefined" && marked.parse) {
        try {
          marked.use({ extensions: [parseMathExtension, inlineMathExtension] });
          markedReady = true;
        } catch (e) {}
      }

      var I18N = {
        zh: { title: "AI 对话 - Fizgrad", settings: "设置", apiConfig: "API 配置", modelId: "Model ID", corsProxy: "CORS 代理 (可选)", systemPrompt: "System Prompt", maxTokens: "Max Tokens", clearChat: "清空对话", cfgHint: "修改自动保存到 localStorage。", emptyMsg: "配置好 API 后开始对话吧。", emptySub: "支持 Markdown 渲染、代码高亮、流式输出。", inputPlaceholder: "输入消息... (Enter 发送, Shift+Enter 换行)", send: "发送", cleared: "对话已清空。", thinkingText: "思考中...", thinking: "思考模式", thinkingOn: "开启 (默认)", thinkingOff: "关闭", reasoningEffort: "推理强度", responseFormat: "输出格式", respText: "普通文本", respJson: "JSON", streamUsage: "返回 Token 用量统计", userId: "用户标识 (可选)", emptyReply: "空回复", reqFailed: "请求失败: ", needApiKey: "请先填写 API Key 并保存。", sendBtn: "发送", genBtn: "生成中", you: "你", modelCustom: "自定义...", corsHint: "若遇到 CORS 报错，请使用 CORS 代理。", jsonHint: "JSON 模式需在 System Prompt 或消息中明确要求 JSON 格式，否则可能输出空白。" },
        en: { title: "AI Chat - Fizgrad", settings: "Settings", apiConfig: "API Config", modelId: "Model ID", corsProxy: "CORS Proxy (optional)", systemPrompt: "System Prompt", maxTokens: "Max Tokens", clearChat: "Clear Chat", cfgHint: "Changes auto-saved to localStorage.", emptyMsg: "Configure your API and start chatting.", emptySub: "Supports Markdown rendering, code highlighting, streaming.", inputPlaceholder: "Type a message... (Enter to send, Shift+Enter for newline)", send: "Send", cleared: "Chat cleared.", thinkingText: "Thinking...", thinking: "Thinking Mode", thinkingOn: "On (default)", thinkingOff: "Off", reasoningEffort: "Reasoning Effort", responseFormat: "Response Format", respText: "Text", respJson: "JSON", streamUsage: "Show Token Usage", userId: "User ID (optional)", emptyReply: "Empty reply", reqFailed: "Request failed: ", needApiKey: "Please enter your API Key and save first.", sendBtn: "Send", genBtn: "Generating", you: "You", modelCustom: "Custom...", corsHint: "If you get CORS errors, use a CORS proxy.", jsonHint: "JSON mode requires explicit JSON instructions in System Prompt or messages, otherwise may output blank." },
      };
      var lang = (function () {
        var stored = localStorage.getItem("lang");
        if (stored === "en" || stored === "zh") return stored;
        return (navigator.language || "zh").toLowerCase().indexOf("en") === 0 ? "en" : "zh";
      })();
      function t(key) { return I18N[lang][key] || key; }
      function applyI18n() {
        document.title = (I18N[lang].title || "AI 对话 - Fizgrad");
        document.querySelectorAll("[data-i18n]").forEach(function (el) {
          var key = el.getAttribute("data-i18n");
          if (I18N[lang][key]) el.textContent = I18N[lang][key];
        });
        document.querySelectorAll("[data-i18n-ph]").forEach(function (el) {
          var key = el.getAttribute("data-i18n-ph");
          if (I18N[lang][key]) el.placeholder = I18N[lang][key];
        });
        var customOpt = document.querySelector("#cfg-model-select option[data-i18n]");
        if (customOpt) customOpt.textContent = I18N[lang].modelCustom || "Custom...";
        var btn = document.getElementById("lang-toggle");
        if (btn) {
          btn.textContent = lang === "zh" ? "EN" : "中";
          btn.setAttribute("aria-label", lang === "zh" ? "Switch to English" : "切换到中文");
        }
      }
      applyI18n();
      document.getElementById("lang-toggle").addEventListener("click", function () {
        lang = lang === "zh" ? "en" : "zh";
        localStorage.setItem("lang", lang);
        applyI18n();
      });

      var cfg = {
        baseurl: "https://api.deepseek.com",
        apikey: "",
        model: "deepseek-v4-pro",
        proxy: "",
        system: "",
        temp: 1.0,
        topp: 1.0,
        maxtokens: 4096,
        stop: "",
        thinking: "enabled",
        reasoning: "high",
        respformat: "text",
        stream: true,
        streamUsage: false,
        userid: ""
      };

      try {
        var saved = JSON.parse(localStorage.getItem("chat-cfg") || "{}");
        for (var k in saved) { if (saved[k] !== undefined) cfg[k] = saved[k]; }
      } catch (e) {}

      function autoSave() {
        cfg.baseurl = document.getElementById("cfg-baseurl").value.replace(/\/+$/, "");
        cfg.apikey = document.getElementById("cfg-apikey").value.trim();
        cfg.proxy = document.getElementById("cfg-proxy").value.trim();
        cfg.system = document.getElementById("cfg-system").value.trim();
        cfg.temp = parseFloat(document.getElementById("cfg-temp").value);
        cfg.topp = parseFloat(document.getElementById("cfg-topp").value);
        cfg.maxtokens = parseInt(document.getElementById("cfg-maxtokens").value, 10) || 4096;
        cfg.stop = document.getElementById("cfg-stop").value.trim();
        cfg.thinking = document.getElementById("cfg-thinking").value;
        cfg.reasoning = document.getElementById("cfg-reasoning").value;
        cfg.respformat = document.getElementById("cfg-respformat").value;
        cfg.stream = document.getElementById("cfg-stream").checked;
        cfg.streamUsage = document.getElementById("cfg-stream-usage").checked;
        cfg.userid = document.getElementById("cfg-userid").value.trim();
        var sel = document.getElementById("cfg-model-select");
        if (sel.value === "__custom__") {
          cfg.model = document.getElementById("cfg-model-custom").value.trim() || "deepseek-v4-pro";
        } else {
          cfg.model = sel.value;
        }
        localStorage.setItem("chat-cfg", JSON.stringify(cfg));
      }

      function fillCfgForm() {
        document.getElementById("cfg-baseurl").value = cfg.baseurl;
        document.getElementById("cfg-apikey").value = cfg.apikey;
        document.getElementById("cfg-proxy").value = cfg.proxy;
        document.getElementById("cfg-system").value = cfg.system;
        document.getElementById("cfg-temp").value = cfg.temp;
        document.getElementById("temp-val").textContent = cfg.temp;
        document.getElementById("cfg-topp").value = cfg.topp;
        document.getElementById("topp-val").textContent = cfg.topp;
        document.getElementById("cfg-maxtokens").value = cfg.maxtokens;
        document.getElementById("cfg-stop").value = cfg.stop;
        document.getElementById("cfg-thinking").value = cfg.thinking;
        document.getElementById("cfg-reasoning").value = cfg.reasoning;
        document.getElementById("cfg-respformat").value = cfg.respformat;
        document.getElementById("cfg-stream").checked = cfg.stream;
        document.getElementById("cfg-stream-usage").checked = cfg.streamUsage;
        document.getElementById("cfg-userid").value = cfg.userid;
        var sel = document.getElementById("cfg-model-select");
        var found = false;
        for (var i = 0; i < sel.options.length; i++) {
          if (sel.options[i].value === cfg.model) { sel.value = cfg.model; found = true; break; }
        }
        if (!found) {
          sel.value = "__custom__";
          document.getElementById("cfg-model-custom").value = cfg.model;
          document.getElementById("cfg-model-custom").classList.add("show");
        } else {
          document.getElementById("cfg-model-custom").classList.remove("show");
        }
      }

      fillCfgForm();
      ["cfg-temp", "cfg-topp"].forEach(function (id) {
        var slider = document.getElementById(id);
        var display = document.getElementById(id.replace("cfg-", "") + "-val");
        if (display) slider.addEventListener("input", function () { display.textContent = this.value; });
      });
      ["cfg-baseurl", "cfg-apikey", "cfg-proxy", "cfg-system", "cfg-maxtokens", "cfg-stop", "cfg-userid"].forEach(function (id) {
        document.getElementById(id).addEventListener("change", autoSave);
      });
      ["cfg-temp", "cfg-topp", "cfg-thinking", "cfg-reasoning", "cfg-respformat"].forEach(function (id) {
        document.getElementById(id).addEventListener("change", autoSave);
      });
      document.getElementById("cfg-stream").addEventListener("change", autoSave);
      document.getElementById("cfg-stream-usage").addEventListener("change", autoSave);
      document.getElementById("cfg-model-select").addEventListener("change", function () {
        autoSave();
        var custom = document.getElementById("cfg-model-custom");
        if (this.value === "__custom__") {
          custom.classList.add("show");
          custom.focus();
        } else {
          custom.classList.remove("show");
        }
      });

      var settingsPanel = document.getElementById("chat-settings");
      document.getElementById("chat-settings-toggle").addEventListener("click", function () {
        settingsPanel.classList.toggle("open");
      });

      var messages = [];
      var messagesEl = document.getElementById("chat-messages");
      var inputEl = document.getElementById("chat-input");
      var sendBtn = document.getElementById("chat-send");
      var isStreaming = false;
      var isPinned = true;

      function scrollToBottom() {
        messagesEl.scrollTop = messagesEl.scrollHeight;
      }

      messagesEl.addEventListener("scroll", function () {
        var dist = messagesEl.scrollHeight - messagesEl.scrollTop - messagesEl.clientHeight;
        isPinned = dist < 40;
      }, { passive: true });

      function renderMarkdown(text, targetEl, final) {
        if (!markedReady) {
          targetEl.innerHTML = text.replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/\n/g, "<br>");
          return;
        }
        mathItems.clear();
        mathSeq = 0;
        var html = marked.parse(text);
        targetEl.innerHTML = html;
        if (!final) {
          if (isPinned) scrollToBottom();
          return;
        }
        hydrateMathSlots(targetEl);

        /* Mermaid */
        var mermaidBlocks = targetEl.querySelectorAll("pre code.language-mermaid");
        if (mermaidBlocks.length > 0 && typeof mermaid !== "undefined") {
          mermaid.initialize({ startOnLoad: false, theme: "dark" });
          mermaidBlocks.forEach(function (code) {
            var wrapper = document.createElement("div");
            wrapper.className = "mermaid-wrapper";
            var scrollDiv = document.createElement("div");
            scrollDiv.className = "mermaid-scroll";
            var div = document.createElement("div");
            div.className = "mermaid";
            div.textContent = code.textContent;
            scrollDiv.appendChild(div);
            wrapper.appendChild(scrollDiv);
            var controls = document.createElement("div");
            controls.className = "mermaid-controls";
            var scale = 1;
            var baseW = null, baseH = null;
            function applyMermaidZoom() {
              var svg = div.querySelector("svg");
              if (!svg) return;
              if (baseW === null) {
                var rect = svg.getBoundingClientRect();
                baseW = rect.width || 500;
                baseH = rect.height || 300;
              }
              svg.removeAttribute("width");
              svg.removeAttribute("height");
              svg.style.maxWidth = "none";
              svg.style.width = (baseW * scale) + "px";
              svg.style.height = (baseH * scale) + "px";
            }
            var zoomIn = document.createElement("button");
            zoomIn.className = "mermaid-zoom-btn";
            zoomIn.textContent = "+";
            zoomIn.setAttribute("aria-label", "Zoom in");
            zoomIn.addEventListener("click", function () {
              scale = Math.min(scale + 0.1, 3);
              applyMermaidZoom();
            });
            var zoomOut = document.createElement("button");
            zoomOut.className = "mermaid-zoom-btn";
            zoomOut.textContent = "\u2212";
            zoomOut.setAttribute("aria-label", "Zoom out");
            zoomOut.addEventListener("click", function () {
              scale = Math.max(scale - 0.1, 0.5);
              applyMermaidZoom();
            });
            controls.appendChild(zoomIn);
            controls.appendChild(zoomOut);
            wrapper.appendChild(controls);
            code.parentElement.replaceWith(wrapper);
          });
          try { mermaid.run().catch(function () {}); } catch (e) {}
          setTimeout(function () {
            targetEl.querySelectorAll(".mermaid svg").forEach(function (svg) {
              var vb = svg.getAttribute("viewBox");
              if (!vb) return;
              var parts = vb.split(/\s+/);
              var w = parseFloat(parts[2]);
              var h = parseFloat(parts[3]);
              if (!w || !h) return;
              svg.removeAttribute("width");
              svg.removeAttribute("height");
              svg.style.maxWidth = "none";
              svg.style.width = (w * 0.8) + "px";
              svg.style.height = (h * 0.8) + "px";
            });
          }, 800);
        }

        /* hljs */
        if (typeof hljs !== "undefined") {
          targetEl.querySelectorAll("pre code:not(.language-mermaid)").forEach(function (block) {
            hljs.highlightElement(block);
          });
        }

        /* MathJax */
        if (final && typeof MathJax !== "undefined" && MathJax.startup && MathJax.startup.promise) {
          MathJax.startup.promise.then(function () {
            MathJax.typesetClear([targetEl]);
            MathJax.typesetPromise([targetEl]).then(function () {
              scrollToBottom();
            }).catch(function () {});
          });
        }

        /* Copy buttons */
        targetEl.querySelectorAll("pre:not(:has(.language-mermaid))").forEach(function (pre) {
          if (pre.querySelector(".copy-btn")) return;
          var btn = document.createElement("button");
          btn.className = "copy-btn";
          btn.textContent = "Copy";
          btn.addEventListener("click", function () {
            var code = pre.querySelector("code");
            var text = code ? code.textContent : "";
            if (navigator.clipboard && navigator.clipboard.writeText) {
              navigator.clipboard.writeText(text).then(function () {
                btn.textContent = "Copied!";
                setTimeout(function () { btn.textContent = "Copy"; }, 1500);
              }).catch(function () {
                btn.textContent = "Failed";
                setTimeout(function () { btn.textContent = "Copy"; }, 1500);
              });
            } else {
              btn.textContent = "Failed";
              setTimeout(function () { btn.textContent = "Copy"; }, 1500);
            }
          });
          pre.appendChild(btn);
        });

        /* Code block folding */
        targetEl.querySelectorAll("pre:not(:has(.language-mermaid))").forEach(function (pre) {
          var code = pre.querySelector("code");
          if (!code) return;
          var lines = code.textContent.replace(/\n$/, "").split("\n").length;
          if (lines <= 15) return;
          var wrapper = document.createElement("div");
          wrapper.className = "code-block-wrapper";
          wrapper.dataset.expanded = "false";
          var existingBtn = pre.querySelector(".copy-btn");
          pre.parentNode.insertBefore(wrapper, pre);
          wrapper.appendChild(pre);
          if (existingBtn) wrapper.appendChild(existingBtn);
          var expandBtn = document.createElement("button");
          expandBtn.className = "code-expand-btn";
          expandBtn.textContent = "展开 (共 " + lines + " 行)";
          expandBtn.addEventListener("click", function () {
            if (wrapper.dataset.expanded === "true") {
              wrapper.dataset.expanded = "false";
              expandBtn.textContent = "展开 (共 " + lines + " 行)";
            } else {
              wrapper.dataset.expanded = "true";
              expandBtn.textContent = "收起";
            }
          });
          wrapper.appendChild(expandBtn);
        });
      }

      function addMessage(role, content) {
        messages.push({ role: role, content: content });
        var wrap = document.createElement("div");
        wrap.className = "chat-msg chat-msg-" + role;

        var avatar = document.createElement("div");
        avatar.className = "chat-avatar";
        avatar.textContent = role === "user" ? t("you") : "AI";

        var bubble = document.createElement("div");
        bubble.className = "chat-bubble";
        if (role === "user") {
          bubble.textContent = content;
        } else {
          bubble.className = "chat-bubble markdown-body";
          renderMarkdown(content, bubble, true);
        }

        wrap.appendChild(avatar);
        wrap.appendChild(bubble);
        messagesEl.appendChild(wrap);
        scrollToBottom();
        return bubble;
      }

      function clearChat() {
        messages = [];
        messagesEl.innerHTML = '<div class="chat-empty"><p>' + t("cleared") + '</p></div>';
      }

      document.getElementById("cfg-clear").addEventListener("click", clearChat);

      inputEl.addEventListener("input", function () {
        this.style.height = "auto";
        this.style.height = Math.min(this.scrollHeight, 150) + "px";
      });

      inputEl.addEventListener("keydown", function (e) {
        if (e.key === "Enter" && !e.shiftKey) {
          e.preventDefault();
          doSend();
        }
      });

      sendBtn.addEventListener("click", doSend);

      function doSend() {
        if (isStreaming) return;
        var text = inputEl.value.trim();
        if (!text) return;
        if (!cfg.apikey) {
          settingsPanel.classList.add("open");
          alert(t("needApiKey"));
          return;
        }

        var empty = messagesEl.querySelector(".chat-empty");
        if (empty) empty.remove();

        addMessage("user", text);
        inputEl.value = "";
        inputEl.style.height = "auto";

        var apiMessages = [];
        if (cfg.system) apiMessages.push({ role: "system", content: cfg.system });
        for (var i = 0; i < messages.length; i++) {
          apiMessages.push({ role: messages[i].role, content: messages[i].content });
        }

        var bubble = addMessage("assistant", "");
        bubble.innerHTML = '<span class="chat-typing">' + t("thinkingText") + '</span>';
        isStreaming = true;
        sendBtn.disabled = true;
        sendBtn.textContent = t("genBtn");

        var targetUrl = cfg.baseurl + "/chat/completions";
        var url = cfg.proxy ? cfg.proxy + encodeURIComponent(targetUrl) : targetUrl;
        var bodyObj = {
          model: cfg.model,
          messages: apiMessages,
          max_tokens: cfg.maxtokens,
          temperature: cfg.temp,
          top_p: cfg.topp,
          stream: cfg.stream
        };
        if (cfg.stop) bodyObj.stop = cfg.stop.split(",").map(function (s) { return s.trim(); }).filter(Boolean);
        if (cfg.thinking === "disabled") bodyObj.thinking = { type: "disabled" };
        else bodyObj.thinking = { type: "enabled" };
        if (cfg.thinking === "enabled") bodyObj.reasoning_effort = cfg.reasoning;
        if (cfg.respformat === "json_object") bodyObj.response_format = { type: "json_object" };
        if (cfg.stream && cfg.streamUsage) bodyObj.stream_options = { include_usage: true };
        if (cfg.userid) bodyObj.user_id = cfg.userid.replace(/[^a-zA-Z0-9\-_]/g, "").slice(0, 512);
        var body = JSON.stringify(bodyObj);

        fetch(url, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Authorization": "Bearer " + cfg.apikey
          },
          body: body
        }).then(function (res) {
          if (!res.ok) {
            return res.text().then(function (t) {
              throw new Error("HTTP " + res.status + ": " + t);
            });
          }
          var reader = res.body.getReader();
          var decoder = new TextDecoder();
          var fullText = "";
          var buffer = "";

          function readChunk() {
            reader.read().then(function (chunk) {
              if (chunk.done) {
                isStreaming = false;
                sendBtn.disabled = false;
                sendBtn.textContent = t("sendBtn");
                if (fullText) {
                  messages[messages.length - 1].content = fullText;
                  bubble.className = "chat-bubble markdown-body";
                  renderMarkdown(fullText, bubble, true);
                } else {
                  bubble.innerHTML = '<span class="chat-error">' + t("emptyReply") + '</span>';
                }
                return;
              }
              buffer += decoder.decode(chunk.value, { stream: true });
              var lines = buffer.split("\n");
              buffer = lines.pop();

              for (var i = 0; i < lines.length; i++) {
                var line = lines[i].trim();
                if (!line || !line.startsWith("data:")) continue;
                var data = line.slice(5).trim();
                if (data === "[DONE]") continue;
                try {
                  var json = JSON.parse(data);
                  var delta = json.choices && json.choices[0] && json.choices[0].delta;
                  if (delta && delta.content) {
                    fullText += delta.content;
                    bubble.className = "chat-bubble markdown-body";
renderMarkdown(fullText, bubble, false);
                  }
                } catch (e) {}
              }
              readChunk();
            }).catch(function (err) {
              isStreaming = false;
              sendBtn.disabled = false;
              sendBtn.textContent = t("sendBtn");
              bubble.className = "chat-bubble";
              bubble.innerHTML = '<span class="chat-error">请求失败: ' + (err.message || err) + "</span>";
            });
          }
          readChunk();
        }).catch(function (err) {
          isStreaming = false;
          sendBtn.disabled = false;
          sendBtn.textContent = t("sendBtn");
          bubble.className = "chat-bubble";
          var errMsg = err.message || String(err);
          if (errMsg.indexOf("Failed to fetch") !== -1) {
            errMsg = lang === "zh"
              ? "网络请求失败（可能是 CORS 跨域限制）。请在设置中填入 CORS 代理前缀。"
              : "Network request failed (likely CORS restriction). Please set a CORS proxy prefix in settings.";
          }
          bubble.innerHTML = '<span class="chat-error">' + t("reqFailed") + errMsg + "</span>";
        });
      }
    })();
  </script>
</body>
</html>
